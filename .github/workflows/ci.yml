name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A release calls this workflow; use a different group from its caller.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ZERO_AR_DATE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Install parity-test dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Configure native library
        run: >-
          cmake -S native -B native/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPARSEGRAPH_SANITIZE=${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
      - name: Build C and C++ consumers
        run: cmake --build native/build --parallel 4
      - name: Test native behavior and TypeScript parity
        run: ctest --test-dir native/build --output-on-failure
      - name: Generate native SVG example
        run: native/build/parsegraph_svg > native/build/native-demo.svg
      - name: Record optimized benchmark observations
        if: matrix.build_type == 'Release'
        run: native/build/parsegraph_benchmark --nodes 2000 > native/build/benchmark.csv
      - name: Package native static libraries
        if: matrix.build_type == 'Release'
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cmake --build native/build --target package
          cd native/build
          cmake -E sha256sum parsegraph-native-*.tar.gz > native-SHA256SUMS
      - name: Upload native static package
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: native-package-${{ matrix.os }}
          path: |
            native/build/parsegraph-native-*.tar.gz
            native/build/native-SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Upload native diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.os }}-${{ matrix.build_type }}
          path: |
            native/build/native-demo.svg
            native/build/benchmark.csv
          if-no-files-found: error
          overwrite: true
          retention-days: 14
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ github.event_name != 'release' && 'yarn' || '' }}
          cache-dependency-path: yarn.lock
          package-manager-cache: false
      - name: Use the release packaging npm version
        run: npm install --global npm@11.16.0 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Check formatting and lint
        run: yarn lint:ci
      - name: Check generator and SVG tooling types
        run: |
          yarn examples:check
          yarn svg:check
      - name: Test packaging and release safeguards
        run: |
          yarn test:maintenance
          yarn test:package
          yarn test:release
      - name: Verify npm registry lookups on this runner
        run: node tools/release.cjs check-registry
      - name: Test with coverage
        run: yarn test:cov --ci --runInBand
      - name: Build development bundle
        run: yarn build
      - name: Build, package, and verify the production archive
        run: yarn pack:release
      - name: Generate API documentation
        run: yarn doc
      - name: Package versioned API documentation and checksums
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf "generated/parsegraph-docs-${VERSION}.tgz" -C dist docs
          node tools/release.cjs seal
      - name: Upload verified release candidate
        uses: actions/upload-artifact@v6
        with:
          name: parsegraph-node-${{ matrix.node }}
          path: |
            generated/parsegraph-*.tgz
            generated/release-package.json
            generated/SHA256SUMS
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Upload API documentation
        uses: actions/upload-artifact@v6
        with:
          name: docs-node-${{ matrix.node }}
          path: dist/docs/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-node-${{ matrix.node }}
          path: dist/coverage/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
